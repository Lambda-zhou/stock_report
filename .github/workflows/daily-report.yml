name: Daily AI Stock Report

on:
  schedule:
    - cron: '20 4 * * 1-5'   # UTC 04:20 = 北京 12:20 午盘
    - cron: '0 9 * * 1-5'    # UTC 09:00 = 北京 17:00 收盘
  workflow_dispatch:

jobs:
  stock-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report & notify
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPORT_URL: 'https://lambda-zhou.github.io/stock_report/'
          FOCUS_GROUPS_JSON: ${{ vars.FOCUS_GROUPS_JSON }}
        run: python generate_a_share_daily.py --mode auto --output-dir ga_out --json
