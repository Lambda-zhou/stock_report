name: Daily AI Stock Report

on:
  schedule:
    - cron: '20 4 * * 1-5'   # UTC 04:20 = 北京 12:20 午盘
    - cron: '0 9 * * 1-5'    # UTC 09:00 = 北京 17:00 收盘
  workflow_dispatch:

jobs:
  stock-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report & notify
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPORT_URL: 'https://lambda-zhou.github.io/stock_report/'
          FOCUS_GROUPS_JSON: ${{ vars.FOCUS_GROUPS_JSON }}
        run: python generate_a_share_daily.py --mode auto --output-dir ga_out --json

      - name: Prepare Pages content
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          result = json.loads(Path('ga_out/result.json').read_text(encoding='utf-8'))
          src = Path(result['output_path'])
          dst_dir = Path('pages-content')
          dst_dir.mkdir(parents=True, exist_ok=True)

          if not src.exists():
              raise SystemExit(f'HTML not found: {src}')

          shutil.copy2(src, dst_dir / src.name)
          shutil.copy2(src, dst_dir / 'index.html')
          (dst_dir / '.nojekyll').write_text('', encoding='utf-8')
          (dst_dir / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Prepared Pages content from: {src}')
          PY

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages-content
          clean: true
